name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The season is paused. While this is 'true', GitHub Pages publishes only
  # placeholder/index.html ("Tot 2027") instead of the full site.
  #
  # To bring the whole site back: change this to 'false' and push to main.
  # Nothing else needs to change — src/ is untouched.
  PLACEHOLDER_MODE: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Placeholder mode -------------------------------------------------
      - name: Assemble placeholder site
        if: env.PLACEHOLDER_MODE == 'true'
        run: |
          mkdir -p dist/images/brand
          cp placeholder/index.html dist/index.html
          # Old URLs (/programma, /en/, ...) no longer exist; serve the same
          # page for them instead of a bare GitHub 404.
          cp placeholder/index.html dist/404.html
          cp public/CNAME dist/CNAME
          cp public/images/brand/icon-logo-clear-background.png \
             public/images/brand/text-logo-clear-background.png \
             public/images/brand/og-default.jpg \
             dist/images/brand/

      # --- Full site --------------------------------------------------------
      - name: Setup Node
        if: env.PLACEHOLDER_MODE != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: env.PLACEHOLDER_MODE != 'true'
        run: npm ci

      - name: Build Astro site
        if: env.PLACEHOLDER_MODE != 'true'
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
